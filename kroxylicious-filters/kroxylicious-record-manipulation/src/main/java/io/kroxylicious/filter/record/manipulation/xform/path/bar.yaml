result:
  value: write_json(my_mask(validate_json(read_json($.value))))
  key: write_avro(your_mask(read_avro($.key)))
  timestamp: $.timestamp
  headers: $.headers
where:
  read_json:
    op: io.kroxylicious.op.jackson3.ReadJson
  validate_json:
    op: io.kroxylicious.op.jackson3.Validate
    yamlSchema: |
      type: object
      properties: 
        c: 
          type: array
          items: integer
  my_mask:
    op: io.kroxylicious.ops.dashjoin.Jsonata
    jsonata: $sum(c)
  write_json:
    op: io.kroxylicious.op.jackson3.WriteJson

  read_avro:
    op: io.kroxylicious.op.avro.ReadAvro
    schema: avro_schema
  write_avro:
    op: io.kroxylicious.op.avro.WriteAvro
    format: json
    schema: avro_schema

  your_mask:
    op: io.kroxylicious.op.xform.AvroXform
    xform:
      - select: $.customerId
        apply: hmac(@)
      - select: $.firstName
        apply: redacted(@)
      - select: $.email
        apply: encrypt(@)
      - select: $.address.postCode
        apply: regexReplace("(([A-Z]+[0-9]{2}).*", @, "$1");
#      firstName: "REDACTED";
#      customerId: hmac($.customerId);
#      email: encrypt($[email]);
#      area: regexReplace("(([A-Z]+[0-9]{2}).*", $[address][postCode], "$1");
#      city: $[address][city]
#      "$[address][city]": $[address][city]
#    resultSchema:
#      op: AvroSchema
#    # OR
#    resultSchemaFrom:
#      op: Apicurio
#      url: "https://my.apicurio.internal.example.com:8888"
#      contentId: 1234


  regexReplace:
    op: io.kroxylicious.op.regex.RegexReplace
    engine: "re2j"

  hmac:
    op: io.kroxylicious.op.hmac.Hmac
    key:
      op: Base64Decode
      data: "my-key"

  encrypt:
    op: io.kroxylicious.op.encryption.Encrypt
    kek: "my-kek"
    kms:
     op: io.kroxylicious.AwsKms
