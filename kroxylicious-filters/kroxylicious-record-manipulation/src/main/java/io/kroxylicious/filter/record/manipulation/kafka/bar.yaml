result:
  # TODO there's an assumption lurking here
  # We cannot write foo($.key, $.value) (not an "unary op")
  # Nor can we write foo($) (we don't have an evaluate which we cross trees
  value: write_json(my_mask(validate_json(read_json($.value))))
  key: your_mask(read_avro($.key))
  timestamp: $.timestamp
  headers: $.headers
catch:
  # TODO this would depend on the direction
  # For a produce request we can:
  # * reject the data +- dead letter
  # * accept the data +- dead letter
  # * replace the data with something else +- dead letter
  # For a fetch request we can:
  # * let the data out +- dead letter (multiple reads => multiple errors, unless we use a compacted topic with a common key)
  # * don't let the data out +- dead letter (multiple reads => multiple errors, unless we use a compacted topic with a common key TOPIC-PARTITION-OFFSET-)
  # * replace the data +- dead letter (multiple reads => multiple errors, unless we use a compacted topic with a common key)
  #
  # Note that "replace the data" is just a different pipeline
where:
  read_json:
    op: io.kroxylicious.op.jackson3.DeserializeJson
    format: json
  validate_json:
    op: io.kroxylicious.op.jackson3.Validate
    yamlSchema: |
      type: object
      properties: 
        c: 
          type: array
          items: integer
  my_mask:
    op: io.kroxylicious.ops.dashjoin.Jsonata
    jsonata: $sum(c)
  write_json:
    op: io.kroxylicious.op.jackson3.SerializeJson
    format: yaml

  read_avro:
    op: io.kroxylicious.op.avro.ReadAvro
    schema: avro_schema
  write_avro:
    op: io.kroxylicious.op.avro.WriteAvro
    format: json
    schema: avro_schema

  your_mask:
    op: io.kroxylicious.op.xform.AvroXform
    xform:
      firstName: "REDACTED";
      customerId: hmac($.customerId);
      email: encrypt($[email]);
      area: regexReplace("(([A-Z]+[0-9]{2}).*", $[address][postCode], "$1");
      city: $[address][city]
      "$[address][city]": $[address][city]
    resultSchema:
      op: AvroSchema
    # OR
    resultSchemaFrom:
      op: Apicurio
      url: "https://my.apicurio.internal.example.com:8888"
      contentId: 1234


  regexReplace:
    op: io.kroxylicious.op.regex.RegexReplace
    engine: "re2j"

  hmac:
    op: io.kroxylicious.op.hmac.Hmac
    key:
      op: Base64Decode
      data: "my-key"

  encrypt:
    op: io.kroxylicious.op.encryption.Encrypt
    kek: "my-kek"
    kms:
     op: io.kroxylicious.AwsKms
