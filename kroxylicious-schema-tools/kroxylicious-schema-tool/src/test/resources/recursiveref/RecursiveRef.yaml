$schema: http://json-schema.org/draft-04/schema#
id: https://schema.kroxylicious.io/test/RecursiveRef.yaml
description: Recursive References!
definitions:
  Foo:
    type: object
    properties:
      bar:
        $ref: "#/definitions/Bar"
      barElsewhere:
        $ref: BarElsewhere.yaml
  Bar:
    type: object
    properties:
      foo:
        $ref: "#/definitions/Foo"
